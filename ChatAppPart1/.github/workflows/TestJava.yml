name: Java CI

on:
  push:
    pull_request:
      
jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Set up Java
        uses: actions/setup-java@v4
        with: 
          distribution: termurin
          java-version: '25'
          cache: maven
          
      - name: Run tests 
        run: mvn --batch-mode test
        
     
